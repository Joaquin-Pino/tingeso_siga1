spring.application.name=siga

# Para correr con ./mvnw spring-boot:run: lee el .env de la raíz (en el contenedor no existe y se ignora)
spring.config.import=optional:file:../.env[.properties]

# 8080 por defecto (contenedores); en local SERVER_PORT sale del .env importado arriba
server.port=${SERVER_PORT:8080}

# Postgres del compose publicado en el host (puerto 5434). En contenedor lo pisan las variables SPRING_DATASOURCE_*
spring.datasource.url=jdbc:postgresql://localhost:5434/${POSTGRES_DB:siga}
spring.datasource.username=${POSTGRES_USER:siga}
spring.datasource.password=${POSTGRES_PASSWORD:}


# Hibernate crea/actualiza todas las tablas y restricciones; no hay scripts .sql
spring.jpa.hibernate.ddl-auto=update

# Keycloak como resource server: valida la firma y el emisor de cada JWT (se resuelve al recibir el primer token).
# Si jwk-set-uri tiene valor (contenedores), las claves se piden ahí y issuer-uri solo se compara con el claim iss, sin discovery
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/siga-realm}

# orígenes del frontend permitidos por CORS, separados por coma
siga.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Admin API de Keycloak: el back crea las cuentas de estudiantes y docentes con un cliente confidencial (service account)
keycloak.admin.base-url=${KEYCLOAK_BASE_URL:http://localhost:9090}
keycloak.admin.realm=${KEYCLOAK_REALM:siga-realm}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:siga-backend}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}


# Carga inicial del Apéndice A (carreras, planes y asignaturas) al arrancar si no hay carreras
siga.seed.enabled=${SIGA_SEED_ENABLED:true}
