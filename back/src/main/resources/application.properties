spring.application.name=siga

# Hibernate crea/actualiza todas las tablas y restricciones; no hay scripts .sql
spring.jpa.hibernate.ddl-auto=update

# Keycloak como resource server: valida la firma y el emisor de cada JWT (se resuelve al recibir el primer token)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/siga-realm}

# orígenes del frontend permitidos por CORS, separados por coma
siga.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Admin API de Keycloak: el back crea las cuentas de estudiantes y docentes con un cliente confidencial (service account)
keycloak.admin.base-url=${KEYCLOAK_BASE_URL:http://localhost:9090}
keycloak.admin.realm=${KEYCLOAK_REALM:siga-realm}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:siga-backend}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}
