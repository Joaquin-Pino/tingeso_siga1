services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      TZ: ${TZ:-America/Santiago}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # publicado solo en localhost para correr el back con ./mvnw spring-boot:run (el 5432 suele estar ocupado)
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    restart: unless-stopped
    # start-dev: H2 en el volumen kcdata, sin HTTPS; suficiente para este proyecto
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?define KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD en .env}
      # URL pública fija: el campo iss de los JWT siempre es esta, se pida el token desde donde se pida
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?define KEYCLOAK_PUBLIC_URL en .env}
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      # sustituidos dentro de keycloak/siga-realm-realm.json al importar
      KEYCLOAK_FRONT_URL: ${KEYCLOAK_FRONT_URL:?define KEYCLOAK_FRONT_URL en .env}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?define KEYCLOAK_ADMIN_CLIENT_SECRET en .env}
      SIGA_ADMIN_PASSWORD: ${SIGA_ADMIN_PASSWORD:?define SIGA_ADMIN_PASSWORD en .env}
      TZ: ${TZ:-America/Santiago}
    volumes:
      - ./keycloak/siga-realm-realm.json:/opt/keycloak/data/import/siga-realm-realm.json:ro,z
      - kcdata:/opt/keycloak/data
    ports:
      - "9090:8080"
    healthcheck:
      # la imagen no trae curl: pide /health/ready al puerto de gestión (9000) con bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # las 3 instancias del back comparten la misma config (ancla &back); cada una es un servicio con nombre fijo
  # para que Nginx las referencie por nombre
  back1: &back
    image: ${DOCKERHUB_USER:?define DOCKERHUB_USER en .env}/siga-back:${BACK_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      # issuer = URL pública (la que va en el JWT); las claves se piden por la red interna, sin salir a localhost
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:?}/realms/${KEYCLOAK_REALM:-siga-realm}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-siga-realm}/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-siga-realm}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-siga-backend}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?define KEYCLOAK_ADMIN_CLIENT_SECRET en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?define CORS_ALLOWED_ORIGINS en .env}
      TZ: ${TZ:-America/Santiago}
    # sin `ports`: al back solo se llega por nginx-backend

  back2:
    <<: *back

  back3:
    <<: *back

  # Balanceador round-robin de las 3 instancias del back (ver nginx-backend.conf). Es el único punto de entrada
  # a la API: VITE_BACKEND_URL del front apunta aquí (http://localhost:8090)
  nginx-backend:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./nginx-backend.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      - back1
      - back2
      - back3

  # Frontend (build de React servido por Nginx, ver front/nginx.conf). Las VITE_* se hornean al construir la imagen
  # (build args en el CI), no se leen del .env en tiempo de ejecución. Se publica en 5173 para coincidir con
  # KEYCLOAK_FRONT_URL / CORS_ALLOWED_ORIGINS
  front:
    image: ${DOCKERHUB_USER:?define DOCKERHUB_USER en .env}/siga-front:${FRONT_TAG:-latest}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - nginx-backend

volumes:
  pgdata:
  kcdata:
