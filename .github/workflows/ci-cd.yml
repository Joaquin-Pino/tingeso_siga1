name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    name: Pruebas unitarias (back)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Unit tests
        working-directory: back
        run: ./mvnw -B test -DexcludedGroups=integration
      - name: Cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: back/target/site/jacoco

  integration-tests:
    name: Pruebas de integración (back)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Testcontainers levanta Postgres con el Docker del runner
      - name: Integration tests
        working-directory: back
        run: ./mvnw -B test -Dgroups=integration

  build-and-push:
    name: Build y push a Docker Hub
    needs: [unit-tests, integration-tests]
    # solo en push a master: los pull requests no publican imágenes
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Imagen del back
        uses: docker/build-push-action@v6
        with:
          context: back
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/siga-back:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/siga-back:${{ github.sha }}
      - name: Imagen del front
        uses: docker/build-push-action@v6
        with:
          context: front
          push: true
          build-args: |
            VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}
            VITE_KEYCLOAK_URL=${{ secrets.VITE_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ secrets.VITE_KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ secrets.VITE_KEYCLOAK_CLIENT_ID }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/siga-front:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/siga-front:${{ github.sha }}
